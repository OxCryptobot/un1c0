<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Why Phase 45 exists</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #F4F5F6;
            color: #333D47;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: 120px 1fr;
            border: 1px solid #0A192F;
        }
        .header {
            grid-column: 1 / 13;
            grid-row: 1;
            padding: 0 80px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #0A192F;
        }
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            font-size: 40px;
            color: #0A192F;
        }
        .content-left {
            grid-column: 1 / 9;
            grid-row: 2;
            padding: 40px;
            border-right: 1px solid #0A192F;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .content-right {
            grid-column: 9 / 13;
            grid-row: 2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .chart-container {
            width: 100%;
            height: 480px;
            border: 1px solid #0A192F;
            background-color: #FFF;
            padding: 20px;
        }
        .chart-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .metrics-box {
            border: 1px solid #005A9C;
            padding: 30px;
            margin-bottom: 30px;
        }
        .metric-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #005A9C;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .metric-value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 32px;
            font-weight: 600;
            color: #0A192F;
            margin-bottom: 20px;
        }
        .metric-value:last-child {
            margin-bottom: 0;
        }
        .key-message {
            font-size: 20px;
            line-height: 1.6;
            color: #333D47;
            padding-top: 20px;
            border-top: 1px solid #0A192F;
        }
        .key-message strong {
            color: #0A192F;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h1>Why Phase 45 exists: Observed bottleneck</h1>
        </div>
        <div class="content-left">
            <div class="chart-container">
                <img src="/home/ubuntu/un1c0/benchmarks/phase45_latency_breakdown.png" alt="Phase 45 verifier latency breakdown">
            </div>
        </div>
        <div class="content-right">
            <div class="metrics-box">
                <div class="metric-title">Verification Service p95</div>
                <div class="metric-value">45.8 ms</div>
                <div class="metric-title">Verification Wait p95</div>
                <div class="metric-value">33.5 ms</div>
                <div class="metric-title">Mutation Service p95</div>
                <div class="metric-value">0.187 ms</div>
            </div>
            <div class="key-message">
                <strong>Key message:</strong> The authoritative mutation path is short. Signature verification, canonicalization, and ordered-dispatch backlog dominate the tail at 16 producers.
            </div>
        </div>
    </div>
</body>
</html>
