name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GO_VERSION: '1.21'
  ZIG_VERSION: '0.12.1'

jobs:
  rust-python:
    name: Rust and Python regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Check formatting for maintained Rust modules
        run: |
          rustfmt --check \
            src/agentic.rs src/provider.rs src/provider_openai.rs src/repository.rs \
            src/run_state.rs src/subagent.rs src/verification.rs \
            src/bin/un1c0-agent.rs tests/provider_openai_integration.rs

      - name: Check patch whitespace
        run: git diff --check

      - name: Run Rust tests
        run: cargo test --all-features --all-targets

      - name: Run Python tests
        run: python -m pytest -q

  language-matrix:
    name: Translation matrix
    runs-on: ubuntu-latest
    needs: rust-python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Zig
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://github.com/ziglang/zig/releases/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-linux-x86_64-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version
      - name: Build release binary
        run: cargo build --release
      - name: Run translation matrix
        run: ./scripts/test_matrix.sh

  security:
    name: Dependency and container security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Compose configuration
        run: docker compose -f vault/docker-compose.yml config --quiet
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate Helm security baseline
        run: ./scripts/validate_helm_security.sh
      - name: Build admin-service image
        run: docker build --file vault/admin_service/Dockerfile --tag un1c0-admin-service:ci vault/admin_service
      - name: Inspect image user and healthcheck
        run: |
          test "$(docker inspect --format '{{.Config.User}}' un1c0-admin-service:ci)" = "app"
          docker inspect --format '{{json .Config.Healthcheck}}' un1c0-admin-service:ci

  e2e:
    name: Isolated Vault E2E
    needs: [rust-python, security]
    uses: ./.github/workflows/e2e_wrapped_flow.yml
    secrets: inherit
