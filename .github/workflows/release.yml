name: Release admin service image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/admin-service

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: vault/admin_service
          file: vault/admin_service/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image metadata
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"
          test "$(docker inspect --format '{{.Config.User}}' "${IMAGE_NAME}:${GITHUB_SHA}")" = "app"
          docker inspect --format '{{json .Config.Healthcheck}}' "${IMAGE_NAME}:${GITHUB_SHA}"
