[package]
name = "un1c0"
version = "0.2.0"
edition = "2021"
default-run = "un1c0"

[dependencies]
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
clap = { version = "4.5", features = ["derive"] }
tree-sitter-go = "0.23"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1.2"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.13"

