services:
  vault:
    image: docker.io/hashicorp/vault:1.15.3
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    volumes:
      - ./vault-data:/vault/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "vault status -format=json >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  admin-service:
    build: ./admin_service
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root-token}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-secret}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-3}
      ADMIN_PORT: 5000
    ports:
      - "${ADMIN_PORT:-5000}:5000"
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - admin-logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=1m
      - /var/log/nginx:rw,noexec,nosuid,size=8m
    volumes:
      - ./nginx/mutual_tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_PORT:-8443}:8443"
    depends_on:
      admin-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  admin-logs:
