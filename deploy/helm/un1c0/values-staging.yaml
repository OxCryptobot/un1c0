admin:
  replicaCount: 2
  image:
    tag: ""
    digest: "sha256:REPLACE_WITH_RELEASE_DIGEST"
  existingSecret: un1c0-runtime-secrets
  vaultAddress: "https://vault.example.invalid"

nginx:
  replicaCount: 2
  image:
    tag: ""
    digest: "sha256:REPLACE_WITH_NGINX_RELEASE_DIGEST"
  existingTlsSecret: un1c0-mtls

networkPolicy:
  externalVaultCidr: ""
  nginxIngressCidr: ""
  vaultPort: 443

vault:
  enabled: false
  address: "https://vault.example.invalid"

mesh:
  enabled: true
  provider: istio
  trustDomain: cluster.local
  controlPlaneNamespace: istio-system
  mtlsMode: STRICT
  nginxIngressPrincipals:
    - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
  adminIngressPrincipals:
    - cluster.local/ns/un1c0-staging/sa/un1c0-staging-un1c0-nginx
