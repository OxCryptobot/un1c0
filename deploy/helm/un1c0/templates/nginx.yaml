apiVersion: v1
kind: Service
metadata:
  name: {{ include "un1c0.fullname" . }}-nginx
  labels:
    {{- include "un1c0.labels" . | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "un1c0.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nginx
  ports:
    - name: https
      port: {{ .Values.nginx.service.port }}
      targetPort: https
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "un1c0.fullname" . }}-nginx
  labels:
    {{- include "un1c0.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "un1c0.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "un1c0.labels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
        {{- if .Values.mesh.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "un1c0.nginxServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.nginx.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "un1c0.nginxImage" . | quote }}
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          securityContext:
            {{- toYaml .Values.nginx.containerSecurityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["nginx", "-t"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: certs
              mountPath: /etc/nginx/certs
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: logs
              mountPath: /var/log/nginx
      volumes:
        - name: config
          configMap:
            name: {{ include "un1c0.fullname" . }}-nginx
        - name: certs
          secret:
            secretName: {{ required "nginx.existingTlsSecret is required for staging" .Values.nginx.existingTlsSecret }}
            items:
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              - key: ca.crt
                path: ca.crt
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: logs
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
