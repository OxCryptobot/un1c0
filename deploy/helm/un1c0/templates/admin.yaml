apiVersion: v1
kind: Service
metadata:
  name: {{ include "un1c0.fullname" . }}-admin
  labels:
    {{- include "un1c0.labels" . | nindent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "un1c0.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: {{ .Values.admin.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "un1c0.fullname" . }}-admin
  labels:
    {{- include "un1c0.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "un1c0.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "un1c0.labels" . | nindent 8 }}
        app.kubernetes.io/component: admin
        {{- if .Values.mesh.enabled }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "un1c0.adminServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.admin.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: admin
          image: {{ include "un1c0.adminImage" . | quote }}
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.admin.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: ADMIN_PORT
              value: "5000"
            - name: HTTP_TIMEOUT_SECONDS
              value: {{ .Values.admin.httpTimeoutSeconds | quote }}
            - name: VAULT_ADDR
              value: {{ required "admin.vaultAddress is required for staging" .Values.admin.vaultAddress | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.existingSecret is required" .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKeys.vaultToken }}
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.existingSecret is required" .Values.admin.existingSecret }}
                  key: {{ .Values.admin.secretKeys.adminApiKey }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /logs
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: logs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
